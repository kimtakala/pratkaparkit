{% extends "base.html" %} {% block content %}
<h2>{% if spot %}Muokkaa{% else %}Lisää parkkipaikka{% endif %}</h2>
{% if errors %}
<ul class="errors">
  {% for error in errors %}
  <li>{{ error }}</li>
  {% endfor %}
</ul>
{% endif %}
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  <div class="form-group">
    <label for="title">Otsikko</label>
    <input
      type="text"
      id="title"
      name="title"
      value="{{ form_data.get('title', spot.title if spot else '') if form_data else (spot.title if spot else '') }}"
      required
    />
  </div>
  <div class="form-group">
    <label for="description">Kuvaus</label>
    <textarea id="description" name="description" rows="4">
{{ form_data.get('description', spot.description if spot else '') if form_data else (spot.description if spot else '') }}</textarea
    >
  </div>
  <div class="form-group">
    <label for="lat">Lat</label>
    <input
      type="text"
      id="lat"
      name="lat"
      value="{{ form_data.get('lat', spot.lat if spot else '') if form_data else (spot.lat if spot else '') }}"
      placeholder='Esim. 60°11\'20.5"N tai 60.18903'
      required
    />
  </div>
  <div class="form-group">
    <label for="lon">Lon</label>
    <input
      type="text"
      id="lon"
      name="lon"
      value="{{ form_data.get('lon', spot.lon if spot else '') if form_data else (spot.lon if spot else '') }}"
      placeholder='Esim. 24°58\'27.8"E tai 24.97439'
      required
    />
  </div>
  <div class="form-group">
    <label for="address">Osoite</label>
    <input
      type="text"
      id="address"
      name="address"
      value="{{ form_data.get('address', spot.address if spot else '') if form_data else (spot.address if spot else '') }}"
    />
  </div>
  <div class="form-group">
    <label>Luokitukset</label>
    <div class="classification-grid">
      {% for classification in classifications %}
      <label class="classification-option">
        <input
          type="checkbox"
          name="classifications"
          value="{{ classification.id }}"
          {% if classification.id in selected_classification_ids %}checked{% endif %}
        />
        <span>{{ classification.name }}</span>
      </label>
      {% endfor %}
    </div>
  </div>
  <button type="submit">Tallenna</button>
</form>
{% endblock %}
